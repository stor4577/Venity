<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0e1120">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Venity">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<title>Venity — нейросеть офлайн</title>
<style>
  :root {
    --bg: #0e1120; --bg2: #151a30; --bubble-bot: #1d2340;
    --user1: #5b7cfa; --user2: #7a5cf0;
    --text: #e8eaf6; --muted: #8b91b4; --accent: #5b7cfa;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    background: radial-gradient(1200px 600px at 20% -10%, #1c2450 0%, var(--bg) 55%);
    color: var(--text);
    font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    display: flex; flex-direction: column; overflow: hidden;
  }
  header {
    padding: calc(env(safe-area-inset-top, 0px) + 12px) 16px 12px;
    border-bottom: 1px solid rgba(255,255,255,.06);
    background: rgba(14,17,32,.75); backdrop-filter: blur(10px);
    display: flex; align-items: center; gap: 11px; flex: none;
  }
  .logo {
    width: 38px; height: 38px; border-radius: 11px; flex: none;
    background: linear-gradient(135deg, var(--user1), var(--user2));
    display: grid; place-items: center; font-size: 20px;
  }
  h1 { font-size: 16px; font-weight: 650; letter-spacing: .2px; }
  .sub { font-size: 11.5px; color: var(--muted); margin-top: 2px; display: flex; align-items: center; gap: 5px; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: #3ddc84; flex: none; }
  main {
    flex: 1; overflow-y: auto; padding: 16px 14px 8px;
    display: flex; flex-direction: column; gap: 10px; -webkit-overflow-scrolling: touch;
  }
  .msg { max-width: 86%; padding: 10px 13px; border-radius: 16px; white-space: pre-wrap; word-wrap: break-word; animation: pop .18s ease-out; }
  @keyframes pop { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: none; } }
  .bot { align-self: flex-start; background: var(--bubble-bot); border-bottom-left-radius: 5px; }
  .user { align-self: flex-end; background: linear-gradient(135deg, var(--user1), var(--user2)); border-bottom-right-radius: 5px; }
  .meta { font-size: 10.5px; color: var(--muted); align-self: flex-start; margin: -4px 0 2px 4px; }
  .chips { display: flex; gap: 7px; overflow-x: auto; padding: 2px 14px 10px; flex: none; scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }
  .chip {
    flex: none; font-size: 13px; padding: 7px 12px; border-radius: 999px; cursor: pointer;
    background: rgba(91,124,250,.13); border: 1px solid rgba(91,124,250,.35); color: #b9c6ff;
  }
  .chip:active { background: rgba(91,124,250,.3); }
  footer { padding: 8px 12px calc(env(safe-area-inset-bottom, 0px) + 12px); flex: none; background: rgba(14,17,32,.6); }
  .row { display: flex; gap: 8px; align-items: flex-end; }
  textarea {
    flex: 1; resize: none; max-height: 110px; min-height: 44px; padding: 12px 14px;
    border-radius: 22px; border: 1px solid rgba(255,255,255,.09);
    background: var(--bg2); color: var(--text); font: inherit; outline: none;
  }
  textarea:focus { border-color: rgba(91,124,250,.6); }
  button.send {
    width: 46px; height: 46px; border-radius: 50%; border: 0; flex: none; cursor: pointer;
    background: linear-gradient(135deg, var(--user1), var(--user2)); color: #fff; font-size: 19px;
  }
  button.send:disabled { opacity: .45; }
  .toolbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 7px; font-size: 12px; color: var(--muted); }
  .toggle { display: flex; align-items: center; gap: 6px; cursor: pointer; user-select: none; }
  .toggle input { accent-color: var(--accent); width: 15px; height: 15px; }
  #boot {
    position: fixed; inset: 0; z-index: 20; background: var(--bg);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; text-align: center; padding: 24px;
    transition: opacity .4s;
  }
  #boot.hide { opacity: 0; pointer-events: none; }
  .spinner { width: 42px; height: 42px; border-radius: 50%; border: 3px solid rgba(255,255,255,.12); border-top-color: var(--accent); animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  #bootText { font-size: 14px; color: var(--muted); max-width: 300px; }
  .ready { font-size: 12.5px; color: var(--muted); text-align: center; padding: 4px 0 0; }
</style>
</head>
<body>

<div id="boot">
  <div class="spinner"></div>
  <div id="bootText">Загружаю нейросеть Venity…</div>
  <div class="ready" id="bootNote">Веса модели распаковываются прямо в телефоне.<br>Интернет после этого не нужен.</div>
</div>

<header>
  <div class="logo">🤖</div>
  <div>
    <h1>Venity</h1>
    <div class="sub"><span class="dot"></span><span id="modeLabel">работает офлайн, в этом браузере</span></div>
  </div>
</header>

<main id="chat"></main>

<div class="chips" id="chips"></div>

<footer>
  <div class="toolbar">
    <label class="toggle"><input type="checkbox" id="creative"> Творческий режим</label>
    <span id="stats"></span>
  </div>
  <div class="row">
    <textarea id="input" rows="1" placeholder="Напиши сообщение…" autocomplete="off"></textarea>
    <button class="send" id="send" disabled>➤</button>
  </div>
</footer>

<script>/* Интернет-умения «Venity» для браузера: погода, Википедия, курсы валют, часы.
   Источники (wttr.in, ru.wikipedia.org, open.er-api.com) разрешают CORS, поэтому
   запросы идут напрямую с телефона, без промежуточного сервера.
   Если сети нет — возвращаем null, и отвечает нейросеть (офлайн-режим). */
(function (root) {
  'use strict';

  var TIMEOUT = 3500;        // данные: больше 3,5 с не ждём
  var PROBE_TIMEOUT = 2500;  // проверка «есть ли сеть» — самая короткая
  var BUDGET = 2500;         // весь запрос в интернет целиком, не больше 2,5 с
  var ONLINE_TTL = 300000;   // статус сети помним 5 минут
  var CACHE_TTL = 150000;     // 2,5 минуты
  var ERROR_TTL = 45000;
  var DEFAULT_CITY = 'Tallinn';

  var DESC_RU = {
    'sunny': 'солнечно', 'clear': 'ясно', 'partly cloudy': 'переменная облачность',
    'cloudy': 'облачно', 'overcast': 'пасмурно', 'mist': 'дымка', 'fog': 'туман',
    'patchy rain nearby': 'местами дождь', 'patchy light rain': 'местами дождь',
    'light rain': 'небольшой дождь', 'light rain shower': 'небольшой дождь',
    'moderate rain': 'дождь', 'moderate rain at times': 'временами дождь',
    'heavy rain': 'сильный дождь', 'light drizzle': 'морось',
    'freezing drizzle': 'ледяная морось', 'light freezing rain': 'ледяной дождь',
    'light snow': 'небольшой снег', 'patchy light snow': 'местами снег',
    'snow': 'снег', 'moderate snow': 'умеренный снег', 'heavy snow': 'сильный снег',
    'blizzard': 'метель', 'sleet': 'мокрый снег', 'light sleet': 'мокрый снег',
    'thundery outbreaks possible': 'возможны грозы',
    'patchy light rain with thunder': 'дождь с грозой',
    'moderate or heavy rain with thunder': 'ливень с грозой'
  };

  var CURRENCY_NAMES = [
    ['доллар', 'USD'], ['евро', 'EUR'], ['рубл', 'RUB'], ['фунт', 'GBP'],
    ['злот', 'PLN'], ['кронг', 'SEK'], ['иен', 'JPY'], ['юан', 'CNY']
  ];

  var WEATHER_RE = /погод|температур|дожд|снег|солнечн|ветер|мороз|жарк|холодн|облачн| градус/i;
  var TIME_RE = /котор(ый|ое) час|сколько (сейчас )?времени|какое (сегодня )?число|какая (сегодня )?дата|какой (сегодня )?день/i;
  var CURRENCY_RE = /(^|\s)(курс|валют|доллар|евро|рубл|фунт|кронг|злот|иен|юан)/i;
  var NEWS_RE = /(^|\s)(новост|что (сейчас )?происход|что нового в мире|последние соб|что в мире)/i;
  var WIKI_RE = /^(?:а\s+)?(?:кто так(?:ой|ая|ое)|что так(?:ое|ая)|расскажи (?:про|о|об)|что за|интересно(?:е)? (?:про|о|об)|информация (?:про|о|об)|объясни,? что так(?:ое|ая))\s+(.{2,60})$/i;

  // основы городов с именительным на «а»: «в Москве» → «Москва»
  var FEMININE_STEMS = {
    'москв': 'Москва', 'самар': 'Самара', 'одесс': 'Одесса', 'варшав': 'Варшава',
    'риг': 'Рига', 'праг': 'Прага', 'бухар': 'Бухара', 'анкар': 'Анкара'
  };

  var STOP_CITIES = ['интернете', 'мире', 'принципе', 'общем', 'целом', 'этом', 'это',
    'городе', 'стране', 'окне', 'сети', 'курсе', 'россии', 'европе'];

  var MONTHS = ['января', 'февраля', 'марта', 'апреля', 'мая', 'июня', 'июля',
    'августа', 'сентября', 'октября', 'ноября', 'декабря'];
  var WEEKDAYS = ['понедельник', 'вторник', 'среда', 'четверг', 'пятница',
    'суббота', 'воскресенье'];

  var cache = {};
  var onlineState = { ts: 0, ok: null, pending: null };

  /* ---------- сеть ---------- */

  function fetchRaw(url, asText, limit) {
    var ctrl = typeof AbortController !== 'undefined' ? new AbortController() : null;
    var timer = setTimeout(function () { if (ctrl) ctrl.abort(); }, limit || TIMEOUT);
    var done = function (value) { clearTimeout(timer); return value; };
    var fail = function (err) { clearTimeout(timer); throw err; };
    return fetch(url, ctrl ? { signal: ctrl.signal } : undefined)
      .then(function (r) {
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return asText ? r.text() : r.json();
      })
      .then(done, fail);
  }

  function fetchWithTimeout(url) { return fetchRaw(url, false); }

  function cached(key, fn) {
    var now = Date.now(), hit = cache[key];
    if (hit) {
      var ttl = hit.value !== null ? CACHE_TTL : ERROR_TTL;
      if (now - hit.ts < ttl) return Promise.resolve(hit.value);
    }
    return fn().then(function (value) {
      cache[key] = { ts: now, value: value };
      return value;
    }, function () {
      cache[key] = { ts: now, value: null };
      return null;
    });
  }

  function cachedText(key, fn) {
    var now = Date.now(), hit = cache[key];
    if (hit) {
      var ttl = hit.value !== null ? CACHE_TTL : ERROR_TTL;
      if (now - hit.ts < ttl) return Promise.resolve(hit.value);
    }
    return fn().then(function (value) {
      cache[key] = { ts: now, value: value };
      return value;
    }, function () {
      cache[key] = { ts: now, value: null };
      return null;
    });
  }

  function online(force) {
    var now = Date.now();
    if (!force && onlineState.ok !== null && now - onlineState.ts < ONLINE_TTL) {
      return Promise.resolve(onlineState.ok);
    }
    if (onlineState.pending) return onlineState.pending;
    onlineState.pending = fetchRaw('https://wttr.in/?format=1', true, PROBE_TIMEOUT)
      .then(function () {
        onlineState = { ts: Date.now(), ok: true, pending: null };
        return true;
      }, function () {
        onlineState = { ts: Date.now(), ok: false, pending: null };
        return false;
      });
    return onlineState.pending;
  }

  // «Есть ли вообще смысл ходить в сеть у этого вопроса?»
  // Болтовня («привет», «как дела») сеть не трогает совсем — отвечает нейросеть.
  function looksLikeSkill(text) {
    return TIME_RE.test(text) || WEATHER_RE.test(text) || CURRENCY_RE.test(text) ||
      NEWS_RE.test(text) || WIKI_RE.test(text);
  }

  // Общий лимит на весь поход в интернет: если не уложились — отвечает нейросеть.
  function withBudget(promise, ms) {
    return new Promise(function (resolve) {
      var settled = false;
      var timer = setTimeout(function () {
        if (!settled) { settled = true; resolve(null); }
      }, ms);
      promise.then(function (value) {
        if (settled) return;
        settled = true; clearTimeout(timer); resolve(value);
      }, function () {
        if (settled) return;
        settled = true; clearTimeout(timer); resolve(null);
      });
    });
  }

  /* ---------- умения ---------- */

  function timeNow() {
    var d = new Date();
    var hh = ('0' + d.getHours()).slice(-2), mm = ('0' + d.getMinutes()).slice(-2);
    return 'Сейчас ' + hh + ':' + mm + ' (по часам телефона), ' + d.getDate() + ' ' +
      MONTHS[d.getMonth()] + ' ' + d.getFullYear() + ' года, ' + WEEKDAYS[(d.getDay() + 6) % 7] + '.';
  }

  function cityCandidates(city) {
    city = (city || '').trim();
    if (!city) return [];
    var low = city.toLowerCase(), stem = /[еиуы]$/.test(low) ? city.slice(0, -1) : city;
    var list = [];
    if (FEMININE_STEMS[stem.toLowerCase()]) list.push(FEMININE_STEMS[stem.toLowerCase()]);
    if (/и$/.test(low)) list.push(stem + 'ь', stem);      // «Казани» → «Казань»
    else if (/е$/.test(low)) list.push(stem, stem + 'а'); // «Москве» → «Москва», «Таллине» → «Таллин»
    else list.push(stem);
    list.push(city);
    var seen = {}, out = [];
    list.forEach(function (c) {
      if (c && !seen[c.toLowerCase()]) { seen[c.toLowerCase()] = 1; out.push(c); }
    });
    return out;
  }

  function station(name) {
    return cached('weather:' + name.toLowerCase(), function () {
      return fetchWithTimeout('https://wttr.in/' + encodeURIComponent(name) + '?format=j1&lang=ru');
    });
  }

  function weather(city) {
    var cands = cityCandidates(city || DEFAULT_CITY).slice(0, 2);
    var idx = 0;

    function tryFast() {
      if (idx >= cands.length) return Promise.resolve(null);
      var cand = cands[idx++];
      return cachedText('wfast:' + cand.toLowerCase(), function () {
        return fetchRaw('https://wttr.in/' + encodeURIComponent(cand) +
          '?format=' + encodeURIComponent('%l|%C|%t|%f|%w|%h') + '&lang=ru&m', true);
      }).then(function (raw) {
        if (!raw || raw.indexOf('|') < 0 || /unknown/i.test(raw)) return tryFast();
        var parts = raw.split('|').map(function (x) { return x.trim(); });
        if (parts.length < 6 || !parts[0] || !parts[2]) return tryFast();
        var place = parts[0], desc = parts[1], temp = parts[2], feels = parts[3],
            wind = parts[4], hum = parts[5];
        if (place.toLowerCase() === cand.toLowerCase() && FEMININE_STEMS[place.toLowerCase()]) {
          place = FEMININE_STEMS[place.toLowerCase()];
        }
        var out = 'Погода сейчас: ' + place + ' — ' + desc.toLowerCase() + ', ' + temp;
        var t = parseInt(temp, 10), f = parseInt(feels, 10);
        if (!isNaN(t) && !isNaN(f) && Math.abs(f - t) >= 3) out += ' (ощущается как ' + feels + ')';
        return out + '. Ветер ' + wind.replace('km/h', 'км/ч') + ', влажность ' + hum + '.';
      });
    }

    // запасной путь: полный JSON wttr.in (медленнее, но подробнее)
    function tryFull() {
      var cand = cands[0];
      return station(cand).then(function (data) {
        if (!data) return null;
        var cur = (data.current_condition || [{}])[0];
        if (!cur.temp_C) return null;
        var desc = cur.lang_ru && cur.lang_ru[0]
          ? cur.lang_ru[0].value.trim().toLowerCase()
          : (DESC_RU[((cur.weatherDesc || [{}])[0].value || '').trim().toLowerCase()] || '');
        var out = 'Погода сейчас: ' + cand.charAt(0).toUpperCase() + cand.slice(1) + ' — ' +
          (desc || 'без описания') + ', ' + cur.temp_C + '°C';
        var t = parseInt(cur.temp_C, 10), f = parseInt(cur.FeelsLikeC, 10);
        if (!isNaN(t) && !isNaN(f) && Math.abs(f - t) >= 3) out += ' (ощущается как ' + f + '°C)';
        return out + '. Ветер ' + cur.windspeedKmph + ' км/ч, влажность ' + cur.humidity + '%.';
      });
    }

    return tryFast().then(function (answer) {
      return answer || tryFull();
    });
  }

  function currency(text) {
    var low = text.toLowerCase(), target = null;
    CURRENCY_NAMES.forEach(function (pair) {
      if (!target && low.indexOf(pair[0]) >= 0) target = pair[1];
    });
    target = target || 'USD';
    var base = target !== 'EUR' ? 'EUR' : 'USD';
    return cached('rates:' + base, function () {
      return fetchWithTimeout('https://open.er-api.com/v6/latest/' + base);
    }).then(function (data) {
      if (!data || data.result !== 'success') return null;
      var rates = data.rates || {};
      if (!rates[target]) return null;
      var out = 'Курс на сегодня: 1 ' + base + ' = ' + rates[target].toFixed(3) + ' ' + target;
      if (rates.RUB && target !== 'RUB') out += ', а 1 ' + base + ' = ' + rates.RUB.toFixed(2) + ' ₽';
      return out + '.';
    });
  }

  function wiki(topic) {
    topic = (topic || '').replace(/[?!.,;:]+$/, '').trim();
    if (!topic) return Promise.resolve(null);
    return cached('wiki:' + topic.toLowerCase(), function () {
      return fetchWithTimeout('https://ru.wikipedia.org/api/rest_v1/page/summary/' +
        encodeURIComponent(topic.replace(/ /g, '_')));
    }).then(function (data) {
      if (!data || data.type === 'disambiguation' || data.type === 'no-extract') return null;
      var extract = (data.extract || '').trim();
      if (extract.length < 40) return null;
      var parts = extract.split(/(?<=[.!?])\s+/);
      var out = parts.slice(0, 2).join(' ').trim();
      if (out.length > 340) out = out.slice(0, 337).replace(/\s\S*$/, '') + '…';
      return out;
    });
  }

  /* ---------- разбор запроса ---------- */

  function extractCity(text) {
    var tokens = text.match(/[A-Za-zА-Яа-яЁё-]{1,}/g) || [];
    var i;
    for (i = 0; i < tokens.length - 1; i++) {
      if (/^(в|во)$/i.test(tokens[i]) && STOP_CITIES.indexOf(tokens[i + 1].toLowerCase()) < 0) {
        return tokens[i + 1];
      }
    }
    for (i = 0; i < tokens.length - 1; i++) {
      if (/^погод/i.test(tokens[i]) && STOP_CITIES.indexOf(tokens[i + 1].toLowerCase()) < 0 &&
          !/^(в|во)$/i.test(tokens[i + 1])) {
        return tokens[i + 1];
      }
    }
    return null;
  }

  function tryAnswer(text) {
    text = (text || '').trim();
    if (!text) return Promise.resolve(null);

    if (TIME_RE.test(text) && text.length <= 70) {
      return Promise.resolve({ text: timeNow(), source: '🕒 часы' });
    }

    // не похоже на умение — в интернет не идём совсем
    if (!looksLikeSkill(text)) return Promise.resolve(null);

    return withBudget(online().then(function (isOnline) {
      if (!isOnline) return null;

      var steps = Promise.resolve(null);

      if (WEATHER_RE.test(text)) {
        steps = steps.then(function (res) {
          if (res) return res;
          var city = extractCity(text) || DEFAULT_CITY;
          return weather(city).then(function (answer) {
            return answer ? { text: answer, source: '🌐 погода · wttr.in' } : null;
          });
        });
      }

      if (CURRENCY_RE.test(text)) {
        steps = steps.then(function (res) {
          if (res) return res;
          return currency(text).then(function (answer) {
            return answer ? { text: answer, source: '🌐 курс · open.er-api.com' } : null;
          });
        });
      }

      if (NEWS_RE.test(text)) {
        steps = steps.then(function (res) {
          if (res) return res;
          // у RSS нет CORS: новости доступны только в серверной версии
          return { text: 'Новостную ленту я читаю только в серверной версии: ' +
            'новостной сайт не разрешает браузеру забирать её напрямую. ' +
            'А погода, курс валют, Википедия и часы работают и здесь, прямо с телефона.',
            source: '🌐 новости — только в серверной версии' };
        });
      }

      var m = text.match(WIKI_RE);
      if (m && m[1]) {
        steps = steps.then(function (res) {
          if (res) return res;
          return wiki(m[1]).then(function (answer) {
            return answer ? { text: answer, source: '🌐 Википедия' } : null;
          });
        });
      }

      return steps;
    }), BUDGET);
  }

  root.VenitySkills = {
    tryAnswer: tryAnswer,
    online: online,
    looksLikeSkill: looksLikeSkill,
    warm: function () { return online(true); },
    setCity: function (city) { DEFAULT_CITY = city || DEFAULT_CITY; },
    getCity: function () { return DEFAULT_CITY; },
    timeNow: timeNow
  };
})(typeof window !== 'undefined' ? window : globalThis);
</script>
<script src="model.js"></script>
<script>
(function () {
  'use strict';
  if (!window.VENITY_DATA_READY) {
    var bt = document.getElementById('bootText');
    var msg = 'Не загрузился файл model.js — он должен лежать рядом с index.html. ' +
              'Проверь список файлов в репозитории и обнови страницу (Ctrl+Shift+R).';
    if (bt) { bt.textContent = msg; } else { alert(msg); }
    return;
  }
  var boot = document.getElementById('boot');
  var bootText = document.getElementById('bootText');
  var chat = document.getElementById('chat');
  var input = document.getElementById('input');
  var sendBtn = document.getElementById('send');
  var creativeBox = document.getElementById('creative');
  var onlineBox = document.getElementById('online');
  var statsEl = document.getElementById('stats');
  var model = null;

  var SUGGESTIONS = ['привет!', 'какая погода в Таллине?', 'кто такой Юрий Гагарин?',
                     'какой курс доллара?', 'сколько времени сейчас?',
                     'мне очень грустно', 'посоветуй фильм', 'расскажи факт о космосе',
                     'не могу начать дело', 'как дела?'];

  function buzz(ms) { try { navigator.vibrate && navigator.vibrate(ms); } catch (e) {} }

  function addMsg(text, who, note) {
    var div = document.createElement('div');
    div.className = 'msg ' + who;
    div.textContent = text;
    chat.appendChild(div);
    if (note) {
      var m = document.createElement('div');
      m.className = 'meta';
      m.textContent = note;
      chat.appendChild(m);
    }
    chat.scrollTop = chat.scrollHeight;
    return div;
  }

  function suggestRow() {
    var box = document.getElementById('chips');
    SUGGESTIONS.forEach(function (s) {
      var c = document.createElement('button');
      c.className = 'chip';
      c.type = 'button';
      c.textContent = s;
      c.addEventListener('click', function () { ask(s); });
      box.appendChild(c);
    });
  }

  function ask(text) {
    text = (text || input.value).trim();
    if (!text || !model) return;
    addMsg(text, 'user');
    input.value = '';
    input.style.height = 'auto';
    sendBtn.disabled = true;
    var wait = addMsg('… 0,0 с', 'bot');
    var t0 = performance.now();
    var secsTimer = setInterval(function () {
      wait.textContent = '… ' + ((performance.now() - t0) / 1000).toFixed(1).replace('.', ',') + ' с';
    }, 100);
    var useInternet = onlineBox.checked && !creativeBox.checked && window.VenitySkills;

    function finish(reply, source) {
      clearInterval(secsTimer);
      var ms = Math.round(performance.now() - t0);
      wait.remove();
      addMsg(reply, 'bot', (source ? source + ' · ' : '') + ms + ' мс' +
        (source ? '' : ' · на этом устройстве'));
      sendBtn.disabled = false;
      buzz(8);
    }

    function neuralReply() {
      var reply;
      try {
        reply = model.reply(text, creativeBox.checked);
      } catch (e) {
        reply = 'Ой, я запуталась внутри себя. Попробуй ещё раз?';
      }
      finish(reply, '');
    }

    setTimeout(function () {
      if (!useInternet) { neuralReply(); return; }
      VenitySkills.tryAnswer(text).then(function (hit) {
        if (hit) { finish(hit.text, hit.source); } else { neuralReply(); }
      }, function () { neuralReply(); });
    }, 30);
  }

  sendBtn.addEventListener('click', function () { ask(); });
  input.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && !e.shiftKey && window.innerWidth > 700) { e.preventDefault(); ask(); }
  });
  input.addEventListener('input', function () {
    input.style.height = 'auto';
    input.style.height = Math.min(input.scrollHeight, 110) + 'px';
  });

  function stage(text, delay, fn) {
    bootText.textContent = text;
    setTimeout(fn, delay);
  }

  function init() {
    var meta, vocab, hints, b64;
    try {
      meta = JSON.parse(document.getElementById('venity-meta').textContent);
      vocab = JSON.parse(document.getElementById('venity-vocab').textContent);
      hints = JSON.parse(document.getElementById('venity-hints').textContent);
      b64 = document.getElementById('venity-weights').textContent.replace(/\s+/g, '');
    } catch (e) {
      bootText.textContent = 'Файл повреждён: не удалось прочитать данные модели.';
      return;
    }

    stage('Распаковываю веса (' + (meta.params / 1000000).toFixed(1) + ' млн параметров)…', 40, function () {
      var bytes;
      try {
        bytes = Venity.fromBase64(b64);
      } catch (e) {
        bootText.textContent = 'Не хватило памяти на распаковку весов. Закрой лишние вкладки и обнови страницу.';
        return;
      }
      b64 = null;
      document.getElementById('venity-weights').textContent = '';

      stage('Собираю нейросеть…', 40, function () {
        model = Venity.create(meta, vocab, bytes);
        bytes = null;
        if (hints && hints.q) model.setHints(hints.q, hints.a);
        document.getElementById('venity-hints').textContent = '';

        stage('Готово!', 200, function () {
          boot.classList.add('hide');
          setTimeout(function () { boot.remove(); }, 500);
          var info = 'Модель: ' + (meta.params / 1000000).toFixed(2) + ' млн параметров · ' +
                     meta.n_layers + ' слоя GRU · словарь ' + meta.vocab_size + ' токенов' +
                     (meta.pairs ? ' · ' + meta.pairs + ' тем в обучении' : '');
          addMsg('Привет! Я Venity — нейросеть, которая работает прямо в твоём телефоне, ' +
                 'без интернета и без сервера. Напиши что-нибудь или нажми подсказку ниже.', 'bot', info);
          sendBtn.disabled = false;
          statsEl.textContent = 'офлайн · ' + (meta.params / 1000000).toFixed(1) + 'M параметров';
          if (window.VenitySkills) {
            VenitySkills.online().then(function (ok) {
              document.getElementById('modeLabel').textContent = ok
                ? 'офлайн-нейросеть + интернет-умения'
                : 'работает офлайн, в этом браузере';
            });
          }
        });
      });
    });
  }

  suggestRow();
  init();
})();
</script>
</body>
</html>
